<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Directorio de Iglesias | IDCLATAM</title>
  <meta name="description" content="Encuentra iglesias de Cristo en Latinoamérica por país y estado. Directorio con direcciones físicas y sitios web.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="src/directorio.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <div class="logo">
        <i class="fas fa-church"></i>
        <h1>IDCLATAM</h1>
        <span class="logo-sub">Directorio de Iglesias</span>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="section-header">
        <h2><i class="fas fa-list-ul"></i> Directorio de Iglesias de Cristo</h2>
        <p>Selecciona un país y un estado para ver las congregaciones disponibles.</p>
      </div>

      <div class="filtros-card">
        <div class="filtros-grid">
          <div class="filtro-grupo">
            <label for="pais"><i class="fas fa-globe-americas"></i> País</label>
            <select id="pais" class="filtro-select">
              <option value="">-- Selecciona un país --</option>
            </select>
          </div>
          <div class="filtro-grupo">
            <label for="estado"><i class="fas fa-map-pin"></i> Estado / Provincia</label>
            <select id="estado" class="filtro-select" disabled>
              <option value="">-- Primero selecciona un país --</option>
            </select>
          </div>
          <div class="filtro-grupo btn-group">
            <button id="limpiarBtn" class="btn-limpiar"><i class="fas fa-eraser"></i> Limpiar</button>
          </div>
        </div>
      </div>

      <div id="resultados" class="resultados">
        <div class="mensaje-inicial">
          <i class="fas fa-church"></i>
          <p>Selecciona un país y estado para ver las iglesias.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 IDCLATAM — Directorio de Iglesias de Cristo en Latinoamérica</p>
    </div>
  </footer>

  <a href="#" class="scroll-top" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></a>

  <script src="src/directorio.js"></script>
</body>
</html>
